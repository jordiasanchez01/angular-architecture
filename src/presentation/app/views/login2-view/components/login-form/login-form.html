<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-8 landscape:gap-1.5">
  @if (error) {
    <div
      class="flex items-start gap-2.5 bg-red-500/6 border border-red-500/18 text-red-400/80 text-xs px-3.5 py-2.5 rounded-xl"
    >
      <svg
        class="w-4 h-4 shrink-0 mt-0.5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <span>{{ error | translate }}</span>
    </div>
  }

  <div class="flex flex-col gap-1.5">
    <div class="relative">
      <mat-form-field appearance="outline" class="w-full thick-border">
        <mat-label>Email</mat-label>
        <input
          matInput
          id="username"
          formControlName="username"
          type="text"
          autocomplete="username"
        />
      </mat-form-field>
    </div>
  </div>
  <div class="flex flex-col gap-1.5">
    <div class="relative">
      <mat-form-field appearance="outline" class="w-full thick-border">
        <mat-label>Contraseña</mat-label>
        <input
          id="password"
          formControlName="password"
          matInput
          [type]="hide() ? 'password' : 'text'"
        />
        <button
          matIconButton
          matSuffix
          (click)="clickEvent($event)"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hide()"
        >
          <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
    </div>
  </div>
  <button matButton="filled" type="submit" [disabled]="isLoading || form.invalid" class="my-button">
    @if (isLoading) {
      <span class="inline-flex items-center gap-1.5">
        <span class="w-1 h-1 rounded-full bg-bg-deep/60 animate-bounce-dot"></span>
        <span
          class="w-1 h-1 rounded-full bg-bg-deep/60 animate-bounce-dot [animation-delay:0.15s]"
        ></span>
        <span
          class="w-1 h-1 rounded-full bg-bg-deep/60 animate-bounce-dot [animation-delay:0.3s]"
        ></span>
      </span>
    } @else {
      Entrar
    }
  </button>
</form>
